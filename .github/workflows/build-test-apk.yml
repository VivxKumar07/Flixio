name: Build Test APK

on:
  push:
    branches:
      - cmp-rewrite
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned

permissions:
  contents: read

concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Full ${{ inputs.build_type == 'release-unsigned' && 'Release' || 'Debug' }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build Full Debug APK
        run: ./gradlew :androidApp:assembleFullDebug "-Pnuvio.android.distribution=full" --parallel --configure-on-demand -x test -x lint -x check --stacktrace

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flixio-apk-debug
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
