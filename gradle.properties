#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
kotlin.native.jvmArgs=-Xmx2048M
kotlin.mpp.enableCInteropCommonization=true
kotlin.incremental=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false

#Gradle
org.gradle.jvmargs=-Xmx2560M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+UseStringDeduplication
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
nuvio.android.distribution=full
